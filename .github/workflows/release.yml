name: Release mod

on:
  push:
    branches:
      - main
    paths:
      - Metadata.json
      - long-jump-mod.csproj
      - Content/**
      - Effects/**
      - Items/**
      - Patches/**
      - LongJumpMod.cs

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read version and detect existing tag
        id: metadata
        shell: bash
        run: |
          version=$(jq -r '.version' Metadata.json)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Metadata.json does not contain a version" >&2
            exit 1
          fi

          tag="v$version"
          git fetch --tags --force

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists. Skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        if: steps.metadata.outputs.changed == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        if: steps.metadata.outputs.changed == 'true'
        run: dotnet restore . --configfile NuGet.config

      - name: Build release bundle
        if: steps.metadata.outputs.changed == 'true'
        run: dotnet publish . -c ReleasePack --no-restore -v:minimal -tl:off

      - name: Publish GitHub release
        if: steps.metadata.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: gh release create "v$VERSION" "bin/ReleasePack/net10.0/long-jump-mod.zip" --title "Long Jump Module $VERSION" --generate-notes